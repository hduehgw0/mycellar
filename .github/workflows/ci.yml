name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 最小権限：CI はリポジトリを読むだけ（push しない）。
permissions:
  contents: read

# prisma.config.ts が env() で必須化しているため、postinstall の prisma generate 用にダミーを渡す。
# generate は DB へ接続しない。DB のテストの接続先は vitest.config.ts が決める。
env:
  DATABASE_URL_UNPOOLED: postgresql://user:password@localhost:5432/db

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 後続の pnpm install 等でトークンが露出しないよう、認証情報を保存しない。
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  db-test:
    runs-on: ubuntu-latest
    services:
      # 手元の compose.yaml と同じ DB にして、接続先を vitest.config.ts の 1 つにそろえる。
      postgres:
        image: postgres:17
        ports:
          - 5433:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mycellar_test
        # 起動しきる前にテストが始まらないよう、接続を受け付けるまで待つ。
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:db
