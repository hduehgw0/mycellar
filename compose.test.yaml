# テスト用の DB（→ docs/adr.md ADR-0020）。開発用の DB は compose.yaml。
# 開発用と別のプロジェクトにして、片方の up や down がもう片方に触らないようにする。
name: mycellar-test

services:
  test-db:
    # 本番の Neon と同じ版にする。
    image: postgres:17
    ports:
      # 開発用の DB（5432）と同時に立てられるようにする。
      # パスワードが固定なので、ほかの端末からはつながらないようにする。
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mycellar_test
    # up --wait は、これが通るまで待つ。起動時の初期化用のサーバーはソケットでしか受け付けないので、
    # -h localhost で TCP を見て、初期化を終えた本番のサーバーが立つまで待つ。
    healthcheck:
      test: pg_isready -h localhost -U postgres -d mycellar_test
      interval: 1s
      timeout: 5s
      retries: 30
    # テストのたびに表を空にするので、データはディスクに残さない。
    tmpfs:
      - /var/lib/postgresql/data
