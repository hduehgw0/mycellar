<!--
  写真のプレースホルダ（ボトル形＋塗りのラベル面）。240x612。
  モック : 02-コレクション一覧.png のカード / 04-ボトル詳細.png
  用途   : ①写真機能が無い MVP 段階でのボトル表示
           ②写真機能の実装後、写真を載せなかった場合の代替画像
  実装先 : src/components/illustrations/bottle-placeholder.tsx ※実装済み
  注意   : ②はアスペクト比と next/image の扱いが写真アップロード（採用）で決まるため、
           その時点で作り直す可能性がある。
           これは設計資料。ここから import せず、実装時に src/ 側へコピーする。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="612" viewBox="0 0 240 612"><defs><linearGradient id="g" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#4a3b28"></stop><stop offset="1" stop-color="#241a0f"></stop></linearGradient></defs><rect x="97.5" y="0" width="45" height="138" rx="10" fill="#3a2a1c"></rect><rect x="0.75" y="116.75" width="238.5" height="494.5" rx="22" fill="url(#g)" stroke="rgba(239,231,218,0.10)" stroke-width="1.5"></rect><rect x="54.5" y="272" width="131" height="166" rx="13" fill="#e6dcc9"></rect></svg>